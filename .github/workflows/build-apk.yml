name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web dependencies
        run: npm install

      - name: Build web app (dist/)
        run: npm run build

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web build into Android project
        run: npx cap sync android

      - name: Generate app icon & splash screen
        run: |
          if [ -f "resources/icon.png" ] && [ -f "resources/splash.png" ]; then
            npx @capacitor/assets generate --android
            echo "✅ আইকন ও স্প্ল্যাশ স্ক্রিন জেনারেট হয়েছে।"
          else
            echo "⚠️ resources/icon.png বা resources/splash.png পাওয়া যায়নি — ডিফল্ট আইকন থাকবে।"
          fi

      - name: Add Firebase config (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "⚠️ GOOGLE_SERVICES_JSON secret পাওয়া যায়নি — পুশ নোটিফিকেশন ছাড়া build হবে।"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks
            echo "✅ Keystore পাওয়া গেছে — Signed Release APK বানানো হবে।"
          else
            echo "⚠️ KEYSTORE_BASE64 secret পাওয়া যায়নি — শুধু Debug APK বানানো হবে।"
          fi

      - name: Build Debug APK (সবসময় বানানো হয়, টেস্টের জন্য)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Build Signed Release APK (শুধু keystore থাকলে)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=app/release-key.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK artifact
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
